<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(760px 500px at 82% 30%, rgba(234, 83, 31, .26), transparent 62%),
      radial-gradient(620px 460px at 96% 96%, rgba(96, 62, 200, .2), transparent 66%),
      #07080d;
    color: #f7f4ef;
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    position: relative;
  }
  .grain {
    position: absolute; inset: 0; opacity: .45;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .wrap { position: absolute; inset: 0; padding: 54px 64px; display: flex; flex-direction: column; z-index: 2; }
  .kicker {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 9px;
    font: 600 12px/1 "Cascadia Mono", Consolas, monospace; letter-spacing: .16em;
    color: #ffb591; text-transform: uppercase;
    border: 1px solid rgba(255,138,61,.35); background: rgba(255,92,26,.1);
    padding: 9px 13px; border-radius: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff5c1a; box-shadow: 0 0 12px #ff5c1a; }
  h1 {
    margin-top: 30px; max-width: 690px;
    font-family: Georgia, "Times New Roman", serif; font-weight: 400;
    font-size: 58px; line-height: 1.02; letter-spacing: -.032em;
  }
  h1 em { color: #ff7a33; font-style: italic; }
  .by { margin-top: auto; display: flex; align-items: center; gap: 14px; }
  .by .rule { width: 34px; height: 1px; background: rgba(255,138,61,.6); }
  .by span { font: 600 13px/1 "Cascadia Mono", Consolas, monospace; letter-spacing: .13em; text-transform: uppercase; color: rgba(247,244,239,.72); }
  .brand { position: absolute; right: 64px; bottom: 54px; text-align: right; z-index: 2; }
  .brand b { font-family: Georgia, serif; font-size: 26px; font-weight: 500; letter-spacing: -.02em; }
  .brand span { display: block; margin-top: 5px; font: 500 10px/1 "Cascadia Mono", Consolas, monospace; letter-spacing: .12em; color: rgba(247,244,239,.45); text-transform: uppercase; }
  .orb { position: absolute; right: 66px; top: 86px; width: 300px; height: 300px; }
  .orb .core {
    position: absolute; inset: 82px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff2df, #ffb27a 24%, #ff6a1f 52%, #a21c00 82%);
    box-shadow: 0 0 80px rgba(255,92,26,.55), inset -16px -20px 44px rgba(80,10,0,.55);
  }
  .orb .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(255,138,61,.2); }
  .orb .r2 { inset: 30px; border-color: rgba(255,138,61,.14); }
  .orb .r3 { inset: 62px; border-color: rgba(255,255,255,.07); }
  .orb .halo { position: absolute; inset: -34px; border-radius: 50%; background: radial-gradient(circle, rgba(255,92,26,.16), transparent 66%); }
  .tag {
    position: absolute; font: 500 10px/1 "Cascadia Mono", Consolas, monospace;
    color: rgba(247,244,239,.75); border: 1px solid rgba(255,255,255,.14);
    background: rgba(10,12,18,.76); padding: 6px 9px; border-radius: 5px;
    white-space: nowrap;
  }
  .t1 { right: 8px; top: 26px; }
  .t2 { right: 196px; bottom: 12px; }
  .t3 { right: -16px; bottom: 112px; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="wrap">
    <div class="kicker"><span class="dot"></span><span id="kick">on-call memory</span></div>
    <h1 id="title"></h1>
    <div class="by"><span class="rule"></span><span id="author"></span></div>
  </div>
  <div class="orb">
    <div class="halo"></div>
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="core"></div>
    <span class="tag t1" id="tag1"></span>
    <span class="tag t2" id="tag2"></span>
    <span class="tag t3" id="tag3"></span>
  </div>
  <div class="brand"><b>Déjà Vu</b><span>the answer is in your history</span></div>
<script>
  const posts = {
    "abinivesh-m": {
      kick: "on-call memory · hindsight",
      title: "Your on-call agent needs <em>Hindsight</em>, not a bigger model",
      author: "Abinivesh M",
      tags: ["31% → 97%", "same fingerprint", "6 min fix"]
    },
    "abhinivesh-k": {
      kick: "provenance · hindsight",
      title: "Receipts, not vibes: why agent memory needs <em>provenance</em>",
      author: "Abhinivesh K",
      tags: ["1 incident = 1 doc", "INC-1006", "fix held"]
    },
    "mrittika-s": {
      kick: "discrimination · hindsight",
      title: "The memory that knows when it is <em>wrong</em>",
      author: "Mrittika S",
      tags: ["look-alike", "ruled out", "with reason"]
    },
    "harini-e-s": {
      kick: "measurement · hindsight",
      title: "33% to 83%: measuring whether agent memory <em>works</em>",
      author: "HARINI E S",
      tags: ["22 graded", "no peeking", "33% → 83%"]
    }
  };
  const m = new URLSearchParams(location.search).get("m") || "abinivesh-m";
  const p = posts[m];
  document.getElementById("kick").textContent = p.kick;
  document.getElementById("title").innerHTML = p.title;
  document.getElementById("author").textContent = p.author;
  document.getElementById("tag1").textContent = p.tags[0];
  document.getElementById("tag2").textContent = p.tags[1];
  document.getElementById("tag3").textContent = p.tags[2];
</script>
</body>
</html>
